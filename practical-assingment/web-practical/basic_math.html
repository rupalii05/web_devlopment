<!DOCTYPE html>
<html>
    <head>
        <title>Javascript lab</title>
    </head>
    <body>
        <h1>Basic Maths</h1>
        <p id="demo"></p>
        
        <script>
          let x=parseInt(prompt("Enter first number:"));
          let y=parseInt(prompt("Enter second number:"));

          let add=x+y;
          let sub=x-y;
          let mul=x*y 
          let div=x/y;
          let mod=x%y;
          document.getElementById("demo").innerHTML= "Sum of two numbers is: " + add + "<br>" + "Subtraction of two number is: " + sub +"<br>"
          + "Multiplication of two numbers is: " + mul + "<br>" + "Division of two numbers is: " + div + "<br>" + "Modulus of two numbers is: " + mod;
          
        </script>
    </body>
</html>

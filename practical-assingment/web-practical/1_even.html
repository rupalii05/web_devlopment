<!DOCTYPE html>
<html>
    <head>
    <title>JavaScript Lab 1</title>
    </head>
    <body>
        <h1>Even or Odd Number</h1>
        <script>
            let num= parseInt(prompt("Enter a number:"));
            if(num % 2 == 0){
                document.write("The number is even.");
            }
            else{
                document.write("The number is Odd.");
            }
        </script>
    </body>
</html>

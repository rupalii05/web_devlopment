<!DOCTYPE html>
<html>
    <head>
    <title>JavaScript Lab </title>
    </head>
    <body>
        <h1>Checking Number</h1>
        <script>
            let num= parseInt(prompt("Enter a number:"));
            if(num>0){
                document.write(num + " number is positive.");
            }
            if(num==0){
                document.write("Your number is zero.");
            }
            if(num<0){
                document.write(num + " number is negative.");
            }
        </script>
    </body>
</html>

<!DOCTYPE html>
<html>
    <body>
        <script>
            let f=1;
            let num=parseInt(prompt("Enter a number to find factorial: "));
            for(let i=num; i>=1; i--){
                f=f*i;
            } 
                document.write("Factorial of number is: " + f ); 

            
        </script>
    </body>
</html>
